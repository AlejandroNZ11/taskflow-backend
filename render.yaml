# Blueprint de Render: crea la base PostgreSQL y el servicio web en un solo paso.
# En Render: New + -> Blueprint -> elegí tu repositorio de GitHub.
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECURE_COOKIES
        value: "1"
      - key: DJANGO_TIME_ZONE
        value: America/Argentina/Buenos_Aires
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@taskflow.local
      # Render te la pide al crear el Blueprint (no queda escrita en el repo)
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
