{% extends "web/base.html" %}
{% block title %}Registro · TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Crear cuenta</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button class="btn btn-success w-100">Registrarme</button>
        </form>
        <p class="mt-3 mb-0 text-center small">¿Ya tenés cuenta? <a href="{% url 'web:login' %}">Ingresá</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
