{% extends "web/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h1 class="h3 mb-3">Nuevo proyecto</h1>
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label|capfirst }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Crear</button>
        <a class="btn btn-outline-secondary" href="{% url 'web:dashboard' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
